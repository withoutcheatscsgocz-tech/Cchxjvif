name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'index.html'
      - 'js/**'
      - 'fonts/**'
      - 'android/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # attach the APK to a GitHub release when a v* tag is pushed

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check every heist is beatable
        run: node tools/solve.js

      - name: Build release APK
        working-directory: android
        env:
          # Optional: set these repository secrets to sign with your own key instead of the shared debug key.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon assembleRelease
          version=$(node -p "require('../package.json').version")
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/time-moves-when-you-draw-$version.apk"

      - name: Play every heist from inside the APK (touch, offline)
        run: |
          npm ci
          npx playwright install --with-deps chromium
          unzip -q dist/*.apk 'assets/web/*' -d "$RUNNER_TEMP/apk"
          node tools/playtest.js --root "$RUNNER_TEMP/apk/assets/web" --touch

      - uses: actions/upload-artifact@v4
        with:
          name: time-moves-when-you-draw-apk
          path: dist/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

  # Publishes the browser build and the APK to itch.io with butler, on v* tags and manual runs.
  # Setup (see README "itch.io"): create the itch.io page first, then add the repository
  # variable ITCH_GAME (<itch-username>/<page-slug>) and the secret BUTLER_API_KEY. Until both
  # exist, the job still builds and checks the web version, then skips the upload with a notice.
  itch:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: itch-deploy
      cancel-in-progress: false
    env:
      ITCH_GAME: ${{ vars.ITCH_GAME }}
      # Pinned and checked: https://broth.itch.zone/butler/linux-amd64/LATEST names the newest
      # version; record the sha256 of its archive/default when you upgrade.
      BUTLER_VERSION: 15.31.0
      BUTLER_SHA256: 4f2a3f22b12f870923504d4b6935535cad377b45859f5fe9419e3adc0611a48c
    steps:
      - name: Check itch.io settings
        id: gate
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }} # only checked for being set
        run: |
          missing=""
          [ -n "$ITCH_GAME" ] || missing="the repository variable ITCH_GAME (<itch-username>/time-moves-when-you-draw)"
          if [ -z "$BUTLER_API_KEY" ]; then
            missing="${missing:+$missing and }the repository secret BUTLER_API_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::notice title=itch.io upload skipped::Set $missing in Settings > Secrets and variables > Actions to publish to itch.io. The web build is still built, played and kept as an artifact."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$ITCH_GAME" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$ ]]; then
            echo "::error title=Bad ITCH_GAME::ITCH_GAME must look like <itch-username>/<page-slug> (no channel, no URL), got: $ITCH_GAME"
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: time-moves-when-you-draw-apk
          path: dist

      - name: Build the web version
        run: node tools/build-web.js

      - name: Play every heist in an itch.io-style iframe (touch, offline)
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node tools/playtest.js --root dist/web --touch --iframe 450x800

      - uses: actions/upload-artifact@v4
        with:
          name: time-moves-when-you-draw-web
          path: dist/time-moves-when-you-draw-web-*.zip

      - name: Install butler
        if: steps.gate.outputs.go == 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/butler.zip" "https://broth.itch.zone/butler/linux-amd64/$BUTLER_VERSION/archive/default"
          echo "$BUTLER_SHA256  $RUNNER_TEMP/butler.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/butler/butler" -V

      - name: Push to itch.io
        if: steps.gate.outputs.go == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }} # only the steps that need the key see it, not npm or Playwright
        run: |
          version=$(node -p "require('./package.json').version")
          apk="dist/time-moves-when-you-draw-$version.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::$apk is not in the APK artifact"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::warning::Tag $GITHUB_REF_NAME doesn't match package.json version $version; itch.io gets $version"
          fi
          butler push dist/web "$ITCH_GAME:html5" --userversion "$version"
          butler push "$apk" "$ITCH_GAME:android" --userversion "$version"
          butler status "$ITCH_GAME"
